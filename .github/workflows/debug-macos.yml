name: Debug macOS hysteresis loop

# Temporary: delete together with debug_macos_loop.py once the macOS timeout is understood.

on:
  workflow_dispatch:
  pull_request:

jobs:
  debug:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.10.2
    - name: Run hysteresis cases with per-step output
      run: pixi run python debug_macos_loop.py 1500
    - name: Print logs
      if: always()
      run: |
        for f in macos-debug/summary.txt macos-debug/environment.txt macos-debug/*.log; do
          echo "::group::$f"
          cat "$f"
          echo "::endgroup::"
        done
    - name: Keep logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: macos-debug
        path: |
          macos-debug/*.txt
          macos-debug/*.log
